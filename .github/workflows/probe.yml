name: probe
on: [workflow_dispatch]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sysctl -n machdep.cpu.brand_string; sysctl -n kern.hv_vmm_present; echo "ANE nodes:"; ioreg -l | grep -c -i "ANE" || true; ioreg -l | grep -i "H11ANE" | head -3 || true
      - run: pip3 install --break-system-packages onnxruntime==1.24.4 huggingface_hub numpy
      - run: python3 bench.py
